name: Android build

on:
  push:
    branches: ['**', '!screenshots']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: '[ -z "$SIGNING_KEY" ] || echo "$SIGNING_KEY" | base64 -d > app/debug.keystore'
      - name: Build, unit test and render screenshots
        run: ./gradlew assembleDebug recordRoborazziDebug --stacktrace
      # Screenshots of every main screen, rendered without a phone, kept on the "screenshots" branch.
      - name: Publish screenshots
        if: always()
        run: |
          [ -d app/build/screenshots ] || exit 0
          mkdir /tmp/shots && cp app/build/screenshots/*.png /tmp/shots/
          cd /tmp/shots
          git init -q -b screenshots
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -qm "Screenshots for ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk braindump.apk
      - uses: actions/upload-artifact@v4
        with:
          name: braindump-debug-apk
          path: braindump.apk
      # main -> a numbered release (v + versionName), marked as the latest one.
      #   Same version again? The APK on that release is replaced.
      #   Download link that always works: releases/latest/download/braindump.apk
      # any other branch -> one "preview" pre-release that gets overwritten.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG="v${VERSION}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" braindump.apk --clobber
            else
              gh release create "$TAG" braindump.apk --target "$GITHUB_SHA" --title "BrainDump ${VERSION}" --notes "BrainDump ${VERSION}" --latest
            fi
          else
            gh release delete preview --yes --cleanup-tag || true
            gh release create preview braindump.apk --target "$GITHUB_SHA" --title "BrainDump preview" --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}." --prerelease
          fi
